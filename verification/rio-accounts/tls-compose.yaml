# Local synthetic TLS proof only; never a staging or production deployment.
services:
  postgres_tls:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    environment:
      POSTGRES_USER: rio_dev
      POSTGRES_DB: rio_synthetic_tls
      POSTGRES_PASSWORD_FILE: /run/rio-proof/password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    entrypoint:
      - /bin/sh
      - -eu
      - -c
      - |
        mkdir -p /run/rio-proof
        chown postgres:postgres /run/rio-proof
        chmod 0700 /run/rio-proof
        cp /run/rio-proof-input/server.key /run/rio-proof/server.key
        cp /run/rio-proof-input/server.pem /run/rio-proof/server.pem
        cp /run/rio-proof-input/password /run/rio-proof/password
        cp /run/rio-proof-input/pg_hba.conf /run/rio-proof/pg_hba.conf
        chown postgres:postgres /run/rio-proof/server.key /run/rio-proof/server.pem /run/rio-proof/password /run/rio-proof/pg_hba.conf
        chmod 0600 /run/rio-proof/server.key /run/rio-proof/server.pem /run/rio-proof/password /run/rio-proof/pg_hba.conf
        exec /usr/local/bin/docker-entrypoint.sh "$$@"
      - rio-tls-entrypoint
    command:
      - postgres
      - -c
      - max_connections=20
      - -c
      - shared_buffers=64MB
      - -c
      - ssl=on
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - ssl_cert_file=/run/rio-proof/server.pem
      - -c
      - ssl_key_file=/run/rio-proof/server.key
      - -c
      - hba_file=/run/rio-proof/pg_hba.conf
    ports:
      - "127.0.0.1:8091:5432"
    volumes:
      - type: bind
        source: "${RIO_TLS_RUNTIME_DIR:?use tls_fixture.py check}"
        target: /run/rio-proof-input
        read_only: true
      - rio_tls_pg_data:/var/lib/postgresql
    security_opt: ["no-new-privileges:true"]
    shm_size: 128mb
    mem_limit: 512m
    restart: "no"
  # The same credentials make TLS refusal observable without an authentication ambiguity.
  postgres_plain:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    environment:
      POSTGRES_USER: rio_dev
      POSTGRES_DB: rio_synthetic_tls
      POSTGRES_PASSWORD_FILE: /run/rio-proof/password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    entrypoint:
      - /bin/sh
      - -eu
      - -c
      - |
        mkdir -p /run/rio-proof
        chown postgres:postgres /run/rio-proof
        chmod 0700 /run/rio-proof
        cp /run/rio-proof-input/password /run/rio-proof/password
        cp /run/rio-proof-input/plain-pg_hba.conf /run/rio-proof/pg_hba.conf
        chown postgres:postgres /run/rio-proof/password /run/rio-proof/pg_hba.conf
        chmod 0600 /run/rio-proof/password /run/rio-proof/pg_hba.conf
        exec /usr/local/bin/docker-entrypoint.sh "$$@"
      - rio-plain-entrypoint
    command:
      - postgres
      - -c
      - max_connections=20
      - -c
      - shared_buffers=64MB
      - -c
      - ssl=off
      - -c
      - hba_file=/run/rio-proof/pg_hba.conf
    ports:
      - "127.0.0.1:8092:5432"
    volumes:
      - type: bind
        source: "${RIO_TLS_RUNTIME_DIR:?use tls_fixture.py check}"
        target: /run/rio-proof-input
        read_only: true
      - rio_plain_pg_data:/var/lib/postgresql
    security_opt: ["no-new-privileges:true"]
    shm_size: 128mb
    mem_limit: 512m
    restart: "no"
volumes:
  rio_tls_pg_data:
  rio_plain_pg_data:
networks:
  default:
    driver: bridge
