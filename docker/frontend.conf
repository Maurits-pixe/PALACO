server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://localhost:5174 https://localhost:5175 https://localhost:5176 https://aether.hoofdkantoor.info https://bastion.hoofdkantoor.info https://5criptie.hoofdkantoor.info; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control no-store always;

    location = /health { access_log off; return 200 'ok'; }
    location /api/ {
        proxy_pass http://bastion-api:3000;
        proxy_connect_timeout 3s;
        proxy_read_timeout 12s;
        client_max_body_size 70k;
    }
    location / { try_files $uri $uri/ /index.html; }
}
