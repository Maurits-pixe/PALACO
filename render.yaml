services:
  - type: web
    name: palaco-neo-preview
    runtime: static
    rootDir: modules/launcher-v1_2
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: off
    headers:
      - source: /*
        headers:
          - key: Content-Security-Policy
            value: "default-src 'none'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://localhost:5174 https://localhost:5175 https://localhost:5176 https://aether.hoofdkantoor.info https://bastion.hoofdkantoor.info https://5criptie.hoofdkantoor.info; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
          - key: X-Content-Type-Options
            value: nosniff
          - key: X-Frame-Options
            value: DENY
          - key: Referrer-Policy
            value: no-referrer
          - key: Permissions-Policy
            value: camera=(), microphone=(), geolocation=()
          - key: Cache-Control
            value: no-store
