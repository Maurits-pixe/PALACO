[package]
name = "palaco-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Explicit opt-in; the protocol fault-injection helper is not a production binary.
plugin-process-tests = []

[[bin]]
name = "plugin-process-fixture"
path = "tests/support/plugin_process_fixture.rs"
test = false
required-features = ["plugin-process-tests"]

[dependencies]
palaco-foundation = { path = "../palaco-foundation" }
palaco-runtime = { path = "../palaco-runtime" }

[dev-dependencies]
palaco-citadel = { path = "../palaco-citadel" }
palaco-eventbus = { path = "../palaco-eventbus" }
palaco-evolution = { path = "../palaco-evolution" }
palaco-quay = { path = "../palaco-quay" }
