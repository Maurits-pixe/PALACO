[package]
name = "palaco-la"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["serde", "v4"] }

[lints.rust]
unsafe_code = "forbid"

[lib]
path = "src/lib.rs"
