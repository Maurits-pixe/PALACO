name: GO-04 Rust Workspace Validation

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".github/workflows/go-04-rust-workspace.yml"
  workflow_dispatch:

permissions:
  contents: read

# GO-04 checkout-repair validation trigger: malformed legacy filename removed.

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Toolchain versions
        run: |
          rustc --version
          cargo --version
          rustfmt --version
          cargo clippy --version
      - name: Workspace metadata
        run: cargo metadata --no-deps --format-version 1
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Workspace check
        run: cargo check --workspace --all-targets
