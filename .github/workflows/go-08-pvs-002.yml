name: GO-08 PVS-002 Cross-Crate Contracts

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "tools/pvs001_workspace_integrity.py"
      - "tools/test_pvs001_workspace_integrity.py"
      - "tools/pvs002_cross_crate_contracts.py"
      - ".github/workflows/go-08-pvs-002.yml"
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "tools/pvs001_workspace_integrity.py"
      - "tools/test_pvs001_workspace_integrity.py"
      - "tools/pvs002_cross_crate_contracts.py"
      - ".github/workflows/go-08-pvs-002.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pvs-002:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: palaco
          # Disposable CI database, reachable only via runner loopback.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d palaco"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/palaco
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: PVS-001 regression
        run: |
          python3 -m unittest discover -s tools -p 'test_pvs001_workspace_integrity.py'
          python3 tools/pvs001_workspace_integrity.py
      - name: PVS-002 dependency and contract audit
        run: python3 tools/pvs002_cross_crate_contracts.py
      - name: Formatting regression
        run: cargo fmt --all -- --check
      - name: Clippy regression
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Workspace check regression
        run: cargo check --workspace --all-targets
      - name: Workspace build regression
        run: cargo build --workspace --all-targets
      - name: Workspace test regression
        run: cargo test --workspace --all-targets
      - name: Explicit PVS-002 integration test
        run: cargo test -p palaco-kernel --test pvs002_cross_crate
