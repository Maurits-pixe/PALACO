name: GO-08 PVS-002 Cross-Crate Contracts

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "crates/**"
      - "tools/pvs001_workspace_integrity.py"
      - "tools/pvs002_cross_crate_contracts.py"
      - ".github/workflows/go-08-pvs-002.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pvs-002:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: PVS-001 regression
        run: python3 tools/pvs001_workspace_integrity.py
      - name: PVS-002 dependency and contract audit
        run: python3 tools/pvs002_cross_crate_contracts.py
      - name: Formatting regression
        run: cargo fmt --all -- --check
      - name: Clippy regression
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Workspace check regression
        run: cargo check --workspace --all-targets
      - name: Workspace build regression
        run: cargo build --workspace --all-targets
      - name: Workspace test regression
        run: cargo test --workspace --all-targets
      - name: Explicit PVS-002 integration test
        run: cargo test -p palaco-kernel --test pvs002_cross_crate
