name: Genesis submodule checkout

on:
  pull_request:
    paths:
      - genesis
      - .gitmodules
      - .github/workflows/genesis-submodule-checkout.yml
  push:
    branches: [main]
    paths:
      - genesis
      - .gitmodules
      - .github/workflows/genesis-submodule-checkout.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate and public Genesis submodule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: true
          persist-credentials: false
      - name: Verify exact gitlink checkout
        shell: bash
        run: |
          set -euo pipefail
          entry="$(git ls-tree HEAD genesis)"
          read -r mode object expected path <<< "$entry"
          test "$mode" = 160000
          test "$object" = commit
          test "$path" = genesis
          test "$(git -C genesis rev-parse HEAD)" = "$expected"
          test -z "$(git -C genesis status --porcelain)"
          test -z "$(git status --porcelain)"
          git submodule status genesis
          echo "Exact Genesis gitlink checkout verified: $expected"
