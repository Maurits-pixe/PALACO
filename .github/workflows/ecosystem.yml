name: Ecosystem quality
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manifest: [Cargo.toml, services/rio-accounts/Cargo.toml]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            services/rio-accounts/target
          key: ${{ runner.os }}-rust-1.98.1-${{ matrix.manifest }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Rust compile (all targets)
        run: cargo check --manifest-path "${{ matrix.manifest }}" --workspace --all-targets --locked

  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - modules/aether-preview
          - modules/citadel-bastion-preview
          - modules/launcher-v1_2
          - services/bastion-demo
          - modules/hara/hannie-agenda
          - modules/hara/hannie-b-d013
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - name: Install locked dependencies (where present)
        run: if [ -f package-lock.json ]; then npm ci --ignore-scripts --no-audit --no-fund; fi
      - name: Prepare existing Hannie B native WAL fixture
        if: matrix.package == 'modules/hara/hannie-b-d013'
        run: |
          gcc -shared -fPIC -O2 -Wall -Werror -o "$RUNNER_TEMP/b013-stall.so" tests/wal-stall.c -ldl
          echo "B013_NATIVE_LIBRARY=$RUNNER_TEMP/b013-stall.so" >> "$GITHUB_ENV"
      - name: Node tests
        run: npm test
      - name: Frontend build (where present)
        run: npm run build --if-present
      - name: Launcher mutation guard tests
        if: matrix.package == 'modules/launcher-v1_2'
        run: npm run test:guard

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build and verify ecosystem health
        run: docker compose up --build --wait --wait-timeout 240
      - name: Service diagnostics
        if: failure()
        run: docker compose ps --all
      - name: Cleanup containers and generated secrets
        if: always()
        run: docker compose down --volumes --remove-orphans
