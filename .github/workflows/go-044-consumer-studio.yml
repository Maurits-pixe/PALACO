name: GO-044 Consumer Studio

on:
  pull_request:
    branches: [main, go-6/palaco-nl-v1]
    paths:
      - website/**
      - docs/PALACO-CX-001.md
      - .github/workflows/go-044-consumer-studio.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consumer-studio:
    name: Consumer Studio model and workspace validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Parse runtime scripts
        run: |
          node --check website/studio-model.js
          node --check website/studio.js
          node --check website/app.js
      - name: Check model and controller behavior
        run: node --test website/tests/studio-model-test.mjs website/tests/studio-workspace-test.mjs
      - name: Check Studio and gateway boundaries
        run: |
          node website/tests/studio-smoke-test.mjs
          node website/tests/smoke-test.mjs
