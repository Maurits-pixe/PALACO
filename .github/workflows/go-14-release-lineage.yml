name: GO-14 Release Lineage Continuity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout with release ancestry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Verify v1.0.0 release lineage and main governance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/verify_go14_release_lineage.py
