name: PALACO L.A.

on:
  push:
    branches: [ main, 'go-026-la-first-source-slice', 'go-*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  la-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17@sha256:31ba9c94a03ada9988f2bb493a22a75eef3a185884533e5cdbcd498ea835b08f
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: palaco
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/palaco
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --locked --workspace
      - name: Test
        run: cargo test --locked --workspace
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
