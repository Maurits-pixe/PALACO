name: GO-056 one-time format repair

on:
  push:
    branches: [ 'go-043-la-execution-gate' ]

permissions:
  contents: write

jobs:
  format-repair:
    if: github.event.head_commit.message != '[GO-056-FMT] cargo fmt'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt
      - name: Apply canonical formatting
        run: cargo fmt --all
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[GO-056-FMT] cargo fmt"
          git push
