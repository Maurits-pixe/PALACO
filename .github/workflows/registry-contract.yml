name: Draft registry contract checks
on:
  pull_request:
    paths:
      - 'release-registry/**'
      - '.github/workflows/registry-contract.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: release-registry
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s release-registry -p 'test_*.py' -v
