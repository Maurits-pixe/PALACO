name: Draft registry contract checks
on:
  pull_request:
    paths:
      - 'release-registry/**'
      - '.github/workflows/registry-contract.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: release-registry
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s release-registry -p 'test_*.py' -v
