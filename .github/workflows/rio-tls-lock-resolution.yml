name: RIO TLS dependency resolution evidence

on:
  push:
    branches: ['codex/rio-tls-subject-binding']
    paths: ['services/rio-accounts/Cargo.toml', '.github/workflows/rio-tls-lock-resolution.yml']

permissions:
  contents: read

jobs:
  resolve-public-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout dependency proposal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install repository-pinned compiler
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
      - name: Resolve proposal from the retained existing lockfile
        run: |
          cargo metadata --manifest-path services/rio-accounts/Cargo.toml --format-version 1 > /dev/null
          python - <<'PY'
          from pathlib import Path
          data = Path("services/rio-accounts/Cargo.lock").read_text()
          assert 'name = "tokio-postgres-rustls"' in data
          assert 'name = "x509-cert"' in data
          assert ' "tokio-postgres-rustls",' in data
          print("RIO_TLS_PUBLIC_LOCK_BEGIN")
          print(data, end="")
          print("RIO_TLS_PUBLIC_LOCK_END")
          PY
