name: RIO accounts synthetic development

on:
  push:
    branches: ['feature/rio-accounts-synthetic-dev', 'codex/rio-staging-endpoint-adapter', 'codex/rio-tls-subject-binding', 'codex/rio-callback-interruption-regression', 'codex/rio-oidc-transport-evidence', 'codex/rio-post-consent-account-read-evidence', 'codex/rio-post-consent-fault-reproduction', 'codex/rio-t05-evidence-triage', 'codex/rio-staging-endpoint-check-cli', 'codex/rio-tls-service-constructor', 'codex/rio-tls-real-oidc-proof', 'codex/rio-binding-bootstrap-guard', 'codex/rio-login-request-failure-evidence']
    paths: ['services/rio-accounts/**', 'verification/rio-accounts/**', 'specs/rio-accounts/**', '.github/workflows/rio-accounts-synthetic.yml']
  pull_request:
    branches: [main, 'feature/rio-accounts-synthetic-dev', 'codex/rio-staging-endpoint-adapter', 'codex/rio-tls-subject-binding', 'codex/rio-callback-interruption-regression', 'codex/rio-oidc-transport-evidence', 'codex/rio-post-consent-account-read-evidence', 'codex/rio-post-consent-fault-reproduction', 'codex/rio-t05-evidence-triage', 'codex/rio-staging-endpoint-check-cli', 'codex/rio-tls-service-constructor', 'codex/rio-tls-real-oidc-proof', 'codex/rio-binding-bootstrap-guard']
    paths: ['services/rio-accounts/**', 'verification/rio-accounts/**', 'specs/rio-accounts/**', '.github/workflows/rio-accounts-synthetic.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rio-account-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install repository-pinned compiler
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Install browser runtime
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Public toolchain versions
        run: |
          rustc --version
          cargo --version
          node --version
          python --version
      - name: Check fixture and browser sources
        run: |
          python -m py_compile verification/rio-accounts/fixture.py verification/rio-accounts/ci-evidence.py verification/rio-accounts/tls_fixture.py
          python -m unittest discover -s verification/rio-accounts -p test_fixture.py
          python -m unittest discover -s verification/rio-accounts -p test_tls_fixture.py
          node --check verification/rio-accounts/tests/accounts.spec.mjs
          node --check verification/rio-accounts/safe-reporter.mjs
          node --check verification/rio-accounts/test_safe_reporter.mjs
          node --test verification/rio-accounts/test_safe_reporter.mjs
          node --check verification/rio-accounts/playwright.tls-oidc.config.mjs
          node --check verification/rio-accounts/tls-oidc-reporter.mjs
          node --test verification/rio-accounts/test_tls_oidc_reporter.mjs
          node --check verification/rio-accounts/playwright.durable.config.mjs
          node --check verification/rio-accounts/durable/durable.spec.mjs
          node --check services/rio-accounts/src/web/app.js
          node --check verification/rio-accounts/mobile/playwright.config.mjs
          node --check verification/rio-accounts/login-observation.mjs
          node --test verification/rio-accounts/test_login_observation.mjs
          node --check verification/rio-accounts/mobile/login-observation.spec.mjs
          node --check verification/rio-accounts/mobile/callback-interruption.spec.mjs
          node --check verification/rio-accounts/mobile/helpers.mjs
          node --check verification/rio-accounts/post-consent-observation.mjs
          node --check verification/rio-accounts/test_post_consent_observation.mjs
          node --test verification/rio-accounts/test_post_consent_observation.mjs
          node --check verification/rio-accounts/post-consent-triage.mjs
          node --check verification/rio-accounts/test_post_consent_triage.mjs
          node --test verification/rio-accounts/test_post_consent_triage.mjs
          node --check verification/rio-accounts/mobile/interaction.spec.mjs
          node --check verification/rio-accounts/mobile/post-consent-fault.spec.mjs
          node --check verification/rio-accounts/mobile/consent.spec.mjs
      - name: Verify T04 human-review evidence remains non-authoritative
        run: |
          python -m py_compile verification/rio-accounts/review_gate.py verification/rio-accounts/test_review_gate.py
          python -m unittest discover -s verification/rio-accounts -p test_review_gate.py
          python verification/rio-accounts/review_gate.py verification/rio-accounts/review/t04-review-template.json
      - name: Build and verify isolated Rust service
        run: |
          cargo fmt --manifest-path services/rio-accounts/Cargo.toml -- --check
          cargo test --manifest-path services/rio-accounts/Cargo.toml --locked
          cargo clippy --manifest-path services/rio-accounts/Cargo.toml --all-targets --locked -- -D warnings
          cargo build --manifest-path services/rio-accounts/Cargo.toml --locked
          cargo doc --manifest-path services/rio-accounts/Cargo.toml --locked --no-deps
      - name: Install exact browser dependencies
        run: |
          npm ci --prefix verification/rio-accounts --ignore-scripts --no-audit --no-fund
          cd verification/rio-accounts
          npx playwright install --with-deps chromium
      - name: Start disposable real Keycloak and PostgreSQL
        run: |
          python verification/rio-accounts/fixture.py up
          python verification/rio-accounts/ci-evidence.py inputs
      - name: Verify owned synthetic PostgreSQL TLS and bound session storage
        run: python verification/rio-accounts/tls_fixture.py check
      - name: Verify actual durable storage and revocation
        run: python verification/rio-accounts/fixture.py run-storage-tests
      - name: Verify actual protected consent HTTP boundary
        run: python verification/rio-accounts/fixture.py run-consent-http-tests
      - name: Start bounded synthetic HTTPS BFF
        run: python verification/rio-accounts/fixture.py start-bff
      - name: Real OIDC browser verification
        working-directory: verification/rio-accounts
        run: npm test
      - name: Durable browser outage and restored connectivity
        working-directory: verification/rio-accounts
        env:
          RIO_DURABLE_BROWSER_PHASE: outage
        run: npx playwright test --config=playwright.durable.config.mjs
      - name: Probe intermittent OIDC readiness after controlled recovery
        working-directory: verification/rio-accounts
        env:
          RIO_DURABLE_BROWSER_PHASE: prepare
          RIO_OIDC_PROBE_MODE: '1'
        run: |
          python -c "print('RIO_OIDC_PROBE_BEGIN case=RIO-DURABLE-01 repeats=8')"
          npx playwright test --config=playwright.durable.config.mjs --repeat-each=8 --retries=0 --workers=1 --max-failures=1
          python -c "print('RIO_OIDC_PROBE_END case=RIO-DURABLE-01 repeats=8')"
      - name: Prepare independent sessions for restart
        working-directory: verification/rio-accounts
        env:
          RIO_DURABLE_BROWSER_PHASE: prepare
        run: npx playwright test --config=playwright.durable.config.mjs
      - name: Restart synthetic service preserving its database
        run: python verification/rio-accounts/fixture.py restart-bff
      - name: Verify persisted sessions and revoke one actor
        working-directory: verification/rio-accounts
        env:
          RIO_DURABLE_BROWSER_PHASE: revoke
        run: npx playwright test --config=playwright.durable.config.mjs
      - name: Restart after committed revocation
        run: python verification/rio-accounts/fixture.py restart-bff
      - name: Verify revocation survives another restart
        id: durable_verify
        working-directory: verification/rio-accounts
        env:
          RIO_DURABLE_BROWSER_PHASE: verify
        run: npx playwright test --config=playwright.durable.config.mjs
      - name: Probe bounded mobile login and draft readiness
        working-directory: verification/rio-accounts
        run: |
          python -c "print('RIO_MOBILE_LOGIN_PROBE_BEGIN case=RIO-MOBILE-02 repeats=8 surface=android-emulation')"
          npx playwright test --config=mobile/playwright.config.mjs --project=android-emulation --grep='RIO-MOBILE-02' --repeat-each=8 --retries=0 --workers=1 --max-failures=1
          python -c "print('RIO_MOBILE_LOGIN_PROBE_END case=RIO-MOBILE-02 repeats=8 surface=android-emulation')"
      - name: Mobile account and local Studio browser verification
        working-directory: verification/rio-accounts
        run: npx playwright test --config=mobile/playwright.config.mjs
      - name: Execute isolated database backup and restoration
        # A later mobile failure must retain its FAIL while this independent
        # proof runs only after verified revocation, never on cancellation.
        if: ${{ !cancelled() && steps.durable_verify.outcome == 'success' }}
        run: |
          python verification/rio-accounts/fixture.py stop-bff
          python verification/rio-accounts/fixture.py prepare-restore-proof
          python verification/rio-accounts/fixture.py backup-db
          python verification/rio-accounts/fixture.py restore-db
      - name: Emit sanitized browser evidence
        if: always()
        run: |
          if test -f verification/rio-accounts/evidence/browser-summary.json; then
            python verification/rio-accounts/ci-evidence.py summary
          fi
      - name: Emit bounded provider startup diagnostics
        if: failure()
        run: |
          if test -f verification/rio-accounts/.runtime/metadata.json; then
            python verification/rio-accounts/fixture.py diagnostics
          fi
      - name: Emit public image and dependency metadata
        if: always()
        run: |
          if docker image inspect quay.io/keycloak/keycloak:26.8.0@sha256:27b3230fbabb8c9ff3c66c864cf09dcd8a41aca82e5100679d109ef0eeb05741 > /dev/null 2>&1; then
            python verification/rio-accounts/ci-evidence.py inputs
          fi
      - name: End synthetic runtime
        if: always()
        run: python verification/rio-accounts/fixture.py down
