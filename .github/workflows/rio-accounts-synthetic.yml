name: RIO accounts synthetic development

on:
  push:
    branches: ['feature/rio-accounts-synthetic-dev']
    paths: ['services/rio-accounts/**', 'verification/rio-accounts/**', 'specs/rio-accounts/**', '.github/workflows/rio-accounts-synthetic.yml']
  pull_request:
    branches: [main]
    paths: ['services/rio-accounts/**', 'verification/rio-accounts/**', 'specs/rio-accounts/**', '.github/workflows/rio-accounts-synthetic.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rio-account-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install repository-pinned compiler
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Install browser runtime
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Public toolchain versions
        run: |
          rustc --version
          cargo --version
          node --version
          python --version
      - name: Bootstrap pinned dependency records
        run: |
          cargo generate-lockfile --manifest-path services/rio-accounts/Cargo.toml
          npm install --prefix verification/rio-accounts --package-lock-only --ignore-scripts --no-audit --no-fund
          cargo fmt --manifest-path services/rio-accounts/Cargo.toml
          python verification/rio-accounts/ci-evidence.py sources
      - name: Check fixture and browser sources
        run: |
          python -m py_compile verification/rio-accounts/fixture.py verification/rio-accounts/ci-evidence.py
          python -m unittest discover -s verification/rio-accounts -p test_fixture.py
          node --check verification/rio-accounts/tests/accounts.spec.mjs
          node --check verification/rio-accounts/safe-reporter.mjs
      - name: Build and verify isolated Rust service
        run: |
          cargo fmt --manifest-path services/rio-accounts/Cargo.toml -- --check
          cargo test --manifest-path services/rio-accounts/Cargo.toml --locked
          cargo clippy --manifest-path services/rio-accounts/Cargo.toml --all-targets --locked -- -D warnings
          cargo build --manifest-path services/rio-accounts/Cargo.toml --locked
          cargo doc --manifest-path services/rio-accounts/Cargo.toml --locked --no-deps
      - name: Install exact browser dependencies
        run: |
          npm ci --prefix verification/rio-accounts --ignore-scripts --no-audit --no-fund
          cd verification/rio-accounts
          npx playwright install --with-deps chromium
      - name: Start disposable real Keycloak and HTTPS BFF
        run: |
          python verification/rio-accounts/fixture.py up
          python verification/rio-accounts/ci-evidence.py inputs
          python verification/rio-accounts/fixture.py run-bff > verification/rio-accounts/.runtime/bff.log 2>&1 &
          printf '%s\n' "$!" > verification/rio-accounts/.runtime/bff.pid
          python - <<'PY'
          import ssl, time, urllib.request
          ctx = ssl.create_default_context(cafile='verification/rio-accounts/.runtime/tls-cert.pem')
          ready = False
          for attempt in range(60):
              try:
                  with urllib.request.urlopen('https://localhost:8088/healthz', context=ctx, timeout=2) as response:
                      ready = response.status == 200
                  if ready: break
              except Exception:
                  time.sleep(1)
          if not ready: raise SystemExit('Synthetic HTTPS BFF did not become ready')
          PY
      - name: Real OIDC browser verification
        working-directory: verification/rio-accounts
        run: npm test
      - name: Emit sanitized browser evidence
        if: always()
        run: |
          if test -f verification/rio-accounts/evidence/browser-summary.json; then
            python verification/rio-accounts/ci-evidence.py summary
          fi
      - name: End synthetic runtime
        if: always()
        run: |
          if test -f verification/rio-accounts/.runtime/bff.pid; then
            kill "$(cat verification/rio-accounts/.runtime/bff.pid)" 2>/dev/null || true
          fi
          python verification/rio-accounts/fixture.py down
