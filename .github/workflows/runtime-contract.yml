name: Runtime Inspection Contract

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "tools/pvs002_cross_crate_contracts.py"
      - ".github/workflows/runtime-contract.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "tools/pvs002_cross_crate_contracts.py"
      - ".github/workflows/runtime-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-contract:
    name: Runtime contract (${{ matrix.os }}, Rust 1.90)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install minimum supported Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - name: Toolchain versions
        run: |
          rustc --version
          cargo --version
      - name: Runtime and kernel formatting
        run: cargo fmt -p palaco-runtime -p palaco-kernel -- --check
      - name: Runtime and kernel clippy
        run: cargo clippy --locked -p palaco-runtime -p palaco-kernel --all-targets -- -D warnings
      - name: Runtime and kernel build including examples
        run: cargo build --locked -p palaco-runtime -p palaco-kernel --all-targets
      - name: Runtime and downstream kernel tests
        run: cargo test --locked -p palaco-runtime -p palaco-kernel --all-targets
      - name: Runtime documentation tests
        run: cargo test --locked -p palaco-runtime --doc
      - name: Execute and verify inspection examples
        shell: python
        run: |
          import json
          import subprocess

          def run(*args):
              return subprocess.run(
                  ["cargo", "run", "--locked", *args],
                  check=True, capture_output=True
              ).stdout

          embedded = run("-p", "palaco-runtime", "--example", "embedded_inspection")
          status = run("-p", "palaco-runtime", "--", "status", "--json")
          if embedded != status:
              raise SystemExit("Embedded report differs from CLI status")
          report = json.loads(embedded)
          if report["schema_version"] != 1 or report["mode"] != "local-inspection":
              raise SystemExit("Unexpected status contract")

          demo = run("-p", "palaco-kernel", "--example", "synthetic_plan_inspection")
          rows = [json.loads(line) for line in demo.splitlines()]
          expected = [
              {
                  "schema_version": 1,
                  "report_type": "plan-inspection",
                  "disposition": disposition,
                  "contract_valid": True,
                  "execution_performed": False,
                  "authority_verified": False,
              }
              for disposition in ["execute", "deny", "deny", "hold"]
          ]
          if rows != expected or not demo.endswith(b"\n"):
              raise SystemExit("Unexpected synthetic plan reports")
          print("Inspection examples match their contracts")
      - name: PVS-002 dependency and contract audit
        run: python tools/pvs002_cross_crate_contracts.py
