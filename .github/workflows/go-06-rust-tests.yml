name: GO-06 Rust Workspace Tests

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "tests/**"
      - ".github/workflows/go-06-rust-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Toolchain versions
        run: |
          rustc --version
          cargo --version
      - name: Test workspace all targets
        run: cargo test --workspace --all-targets
