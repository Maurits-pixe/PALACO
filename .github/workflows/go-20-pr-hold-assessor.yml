name: GO-20 offline evidence assessor
on:
  pull_request:
    paths:
      - 'scripts/pr_hold_assessor.py'
      - 'scripts/pr_attestation_chain.py'
      - 'scripts/pr_attestation_policy.py'
      - 'scripts/pr_replay_preflight.py'
      - 'scripts/pr_replay_transaction_contract.py'
      - 'scripts/pr_replay_interleavings.py'
      - 'scripts/pr_replay_sqlite_harness.py'
      - 'tests/test_pr_hold_assessor.py'
      - 'tests/test_pr_attestation_chain.py'
      - 'tests/test_pr_attestation_policy.py'
      - 'tests/test_pr_replay_preflight.py'
      - 'tests/test_pr_replay_transaction_contract.py'
      - 'tests/test_pr_replay_interleavings.py'
      - 'tests/test_pr_replay_sqlite_harness.py'
      - 'tests/go20_postgres_contract.sql'
      - 'tests/go20_postgres_contract_assertions.sql'
      - 'tests/run_go20_postgres_disposable.sh'
      - 'tests/go20_postgres_rls_fixture.sql'
      - 'tests/run_go20_postgres_rls_disposable.sh'
      - 'tests/go20_postgres_identity_fixture.sql'
      - 'tests/run_go20_postgres_identity_disposable.sh'
      - 'tests/go20_postgres_audit_fixture.sql'
      - 'tests/run_go20_postgres_audit_disposable.sh'
      - '.github/workflows/go-20-pr-hold-assessor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisory-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Run isolated standard-library regressions
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -m unittest discover -s tests -p 'test_pr_hold_assessor.py' -v
          python3 -m unittest discover -s tests -p 'test_pr_attestation_chain.py' -v
          python3 -m unittest discover -s tests -p 'test_pr_attestation_policy.py' -v
          python3 -m unittest discover -s tests -p 'test_pr_replay_preflight.py' -v
          python3 -m unittest discover -s tests -p 'test_pr_replay_transaction_contract.py' -v
          python3 -m unittest discover -s tests -p 'test_pr_replay_interleavings.py' -v
          python3 -m unittest discover -s tests -p 'test_pr_replay_sqlite_harness.py' -v

  disposable-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17@sha256:31ba9c94a03ada9988f2bb493a22a75eef3a185884533e5cdbcd498ea835b08f
        env:
          POSTGRES_DB: go20test
          POSTGRES_USER: go20test
          POSTGRES_PASSWORD: go20test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U go20test -d go20test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install PostgreSQL command-line client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Run disposable PostgreSQL contract and race tests
        env:
          CI_GO20_DISPOSABLE_PG: "yes"
        run: bash tests/run_go20_postgres_disposable.sh
      - name: Test isolated tenant RLS and negative permissions
        env:
          CI_GO20_DISPOSABLE_PG: "yes"
        run: bash tests/run_go20_postgres_rls_disposable.sh
      - name: Test synthetic principal binding and denied role hopping
        env:
          CI_GO20_DISPOSABLE_PG: "yes"
        run: bash tests/run_go20_postgres_identity_disposable.sh
      - name: Test cross-tenant attacks and transactional audit invariants
        env:
          CI_GO20_DISPOSABLE_PG: "yes"
        run: bash tests/run_go20_postgres_audit_disposable.sh
