permissions:
  contents: read

jobs:
  advisory-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Run isolated standard-library regressions
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -m unittest discover -s tests -p 'test_pr_hold_assessor.py' -v
          python3 -m unittest discover -s tests -p 'test_pr_attestation_chain.py' -v
          python3 -m unittest discover -s tests -p 'test_pr_attestation_policy.py' -v
          python3 -m unittest discover -s tests -p 'test_pr_replay_preflight.py' -v
          python3 -m unittest discover -s tests -p 'test_pr_replay_transaction_contract.py' -v
          python3 -m unittest discover -s tests -p 'test_pr_replay_interleavings.py' -v
          python3 -m unittest discover -s tests -p 'test_pr_replay_sqlite_harness.py' -v
          python3 -m unittest discover -s tests -p 'test_pr_audit_integrity.py' -v
          python3 -m unittest discover -s tests -p 'test_pr_audit_export.py' -v
          python3 -m unittest discover -s tests -p 'test_pr_signed_audit_checkpoint.py' -v
          python3 -m unittest discover -s tests -p 'test_pr_audit_continuity.py' -v
          python3 -m unittest discover -s tests -p 'test_pr_audit_witness_forks.py' -v
          python3 -m unittest discover -s tests -p 'test_pr_witness_transparency.py' -v
          python3 -m unittest discover -s tests -p 'test_pr_multiround_assessor.py' -v
          python3 -m unittest discover -s tests -p 'test_pr_assessment_receipt.py' -v
          python3 -m unittest discover -s tests -p 'test_pr_signed_assessment_review.py' -v
          python3 -m unittest discover -s tests -p 'test_pr_review_governance.py' -v
          python3 -m unittest discover -s tests -p 'test_pr_governance_history.py' -v
          python3 -m unittest discover -s tests -p 'test_pr_governance_hardening.py' -v
          python3 -m unittest discover -s tests -p 'test_pr_security_acceptance.py' -v
          python3 -m unittest discover -s tests -p 'test_pr_final_report_attestation.py' -v
          python3 -m unittest discover -s tests -p 'test_pr_final_attestation_history.py' -v
          python3 -m unittest discover -s tests -p 'test_pr_attestation_multiview.py' -v
          python3 -m unittest discover -s tests -p 'test_pr_observer_anchor_custody.py' -v
          python3 -m unittest discover -s tests -p 'test_pr_observer_anchor_history.py' -v
          python3 -m unittest discover -s tests -p 'test_pr_observer_recovery.py' -v
          python3 -m unittest discover -s tests -p 'test_pr_recovery_simulation.py' -v
          python3 -m unittest discover -s tests -p 'test_pr_recovery_transaction.py' -v
          python3 -m unittest discover -s tests -p 'test_pr_concurrent_recovery.py' -v
          python3 -m unittest discover -s tests -p 'test_pr_recovery_handoff.py' -v
          python3 -m unittest discover -s tests -p 'test_pr_recovery_fencing.py' -v
          python3 -m unittest discover -s tests -p 'test_pr_signed_fencing_quorum.py' -v
          python3 -m unittest discover -s tests -p 'test_pr_fencing_quorum_history.py' -v
          python3 -m unittest discover -s tests -p 'test_pr_signed_revocation_fork.py' -v
          python3 -m unittest discover -s tests -p 'test_pr_transparency_checkpoint_views.py' -v
          python3 -m unittest discover -s tests -p 'test_pr_checkpoint_receipt_continuity.py' -v
          python3 -m unittest discover -s tests -p 'test_pr_checkpoint_retention_custody.py' -v
          python3 -m unittest discover -s tests -p 'test_pr_archive_availability_challenge.py' -v
          python3 -m unittest discover -s tests -p 'test_pr_challenge_lifecycle_ledger.py' -v
          python3 -m unittest discover -s tests -p 'test_pr_challenge_ledger_checkpoint.py' -v
          python3 -m unittest discover -s tests -p 'test_pr_challenge_ledger_history.py' -v
          python3 -m unittest discover -s tests -p 'test_pr_ledger_history_receipts.py' -v

  disposable-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17@sha256:31ba9c94a03ada9988f2bb493a22a75eef3a185884533e5cdbcd498ea835b08f
        env:
          POSTGRES_DB: go20test
          POSTGRES_USER: go20test
          POSTGRES_PASSWORD: go20test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U go20test -d go20test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install PostgreSQL command-line client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Run disposable PostgreSQL contract and race tests
        env:
          CI_GO20_DISPOSABLE_PG: "yes"
        run: bash tests/run_go20_postgres_disposable.sh
      - name: Test durable restore idempotency, replay and rollback in disposable PostgreSQL
        env:
          CI_GO20_DISPOSABLE_PG: "yes"
        run: bash tests/run_go20_postgres_recovery_idempotency_disposable.sh
      - name: Test backend termination, timeout rollback and reconnect recovery in disposable PostgreSQL
        env:
          CI_GO20_DISPOSABLE_PG: "yes"
        run: |
          bash -n tests/run_go20_postgres_recovery_faults_disposable.sh
          bash tests/run_go20_postgres_recovery_faults_disposable.sh
      - name: Test isolated tenant RLS and negative permissions
        env:
          CI_GO20_DISPOSABLE_PG: "yes"
        run: bash tests/run_go20_postgres_rls_disposable.sh
      - name: Test synthetic principal binding and denied role hopping
        env:
          CI_GO20_DISPOSABLE_PG: "yes"
        run: bash tests/run_go20_postgres_identity_disposable.sh
      - name: Test cross-tenant attacks and transactional audit invariants
        env:
          CI_GO20_DISPOSABLE_PG: "yes"
        run: bash tests/run_go20_postgres_audit_disposable.sh
      - name: Verify transactional audit fault-injection invariants
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: go20test
          PGDATABASE: go20test
          PGPASSWORD: go20test
        run: psql -X -v ON_ERROR_STOP=1 -f tests/go20_postgres_audit_faults.sql
      - name: Validate PostgreSQL-to-audit-export bridge and tampering rejection
        env:
          CI_GO20_DISPOSABLE_PG: "yes"
          PYTHONDONTWRITEBYTECODE: "1"
        run: bash tests/run_go20_audit_export_disposable.sh
      - name: Verify independent two-PostgreSQL-instance snapshot handoff and reject stale or divergent claims
        env:
          CI_GO20_DISPOSABLE_PG: "yes"
        run: |
          bash -n tests/run_go20_postgres_handoff_disposable.sh
          bash tests/run_go20_postgres_handoff_disposable.sh
      - name: Crash and restart only disposable PostgreSQL container, verify WAL rollback and durable replay
        env:
          CI_GO20_DISPOSABLE_PG: "yes"
        run: |
          bash -n tests/run_go20_postgres_recovery_crash_disposable.sh
          bash tests/run_go20_postgres_recovery_crash_disposable.sh
