name: Hannie B D-013 isolated SQLite
on:
  push:
    branches: ['hara/hannie-b-d013-repair']
    paths: ['modules/hara/hannie-b-d013/**', '.github/workflows/hannie-b-d013.yml']
  pull_request:
    paths: ['modules/hara/hannie-b-d013/**', '.github/workflows/hannie-b-d013.yml']
permissions:
  contents: read
jobs:
  b-d013:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ['24.14.1', '24.19.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - run: node tools/run-evidence.mjs
        working-directory: modules/hara/hannie-b-d013
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: b-d013-${{ matrix.node }}
          path: evidence/hara/b-d013/runs/
          if-no-files-found: error
